name: Docs

on:
    push:
        branches: [main]

env:
    CARGO_TERM_COLOR: always
    RUST_TOOLCHAIN: 1.97.1

permissions:
    contents: read
    pages: write
    id-token: write

# Only one Pages deployment can run at a time. Cancelling an in-flight
# deploy in favor of a newer push is fine, an old build never has to
# finish once a newer one exists, but two deploys should never race
# each other.
concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        name: Build docs
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: ${{ env.RUST_TOOLCHAIN }}
            - uses: Swatinem/rust-cache@v2
            - run: cargo doc --workspace --no-deps
            - run: cp .github/pages/index.html target/doc/index.html
            - uses: actions/configure-pages@v5
            - uses: actions/upload-pages-artifact@v3
              with:
                  path: target/doc

    deploy:
        name: Deploy to GitHub Pages
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
