[package]
name = "orderbook-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
rand = { version = "0.10.2", features = ["std_rng"] }

[[bench]]
name = "matching_benchmarks"
harness = false